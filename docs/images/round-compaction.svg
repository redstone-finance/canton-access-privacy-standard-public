<text class="legend" x="8" y="1194">H − X = 116 − 24 = 92: trees 1–81 and 82–90 end before round 92, so they go; 91–99 stays.</text>
<text class="legend" x="8" y="1212">They are archived with everything below them: 1–9, its blocks, 10–12 and all this call made.</text>
<text class="legend" x="8" y="1230">100 waits; 101–112 on the ledger, not given; 113–116 kept.</text>
<line class="rule" x1="8" y1="1252" x2="892" y2="1252"/>
<text class="legend" x="8" y="1274">Round n is published at hour n. A parent needs all N children. metaRounds keys each by the first and last round it covers.</text>
<text class="legend" x="8" y="1292">A root goes, archived with everything below it, once its last round is older than H − X. Genesis 0 always stays.</text>
