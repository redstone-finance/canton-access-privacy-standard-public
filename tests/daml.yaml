sdk-version: 3.5.12
name: caps-tests
version: 0.1.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../deps/canton-data-standard-utils-v1-0.2.0.dar
  - ../deps/canton-data-standard-datapoint-v1-0.2.0.dar
  - ../deps/canton-data-standard-distributor-key-v1-0.2.0.dar
  - ../deps/canton-data-standard-codecs-0.2.0.dar
  - ../interfaces/caps-api-core-v1/.daml/dist/caps-api-core-v1-0.1.0.dar
  - ../deps/redstone-common-v20-0.5.0.dar
  - ../deps/redstone-sdk-v20-0.5.0.dar
  - ../caps-core/.daml/dist/caps-core-0.1.0.dar
  - ../extensions/caps-extended-licensing/.daml/dist/caps-extended-licensing-0.1.0.dar
  - ../extensions/caps-accounting/.daml/dist/caps-accounting-0.1.0.dar
  - ../extensions/caps-verifier-redstone/.daml/dist/caps-verifier-redstone-0.1.0.dar
  - ../extensions/caps-verifier-datastandard/.daml/dist/caps-verifier-datastandard-0.1.0.dar
  - ../caps-capsule-archiver/.daml/dist/caps-capsule-archiver-0.1.0.dar
  - ../caps-round-archiver/.daml/dist/caps-round-archiver-0.1.0.dar
  - ../tests-fixtures/.daml/dist/caps-tests-fixtures-0.1.0.dar
build-options:
  - --explicit-serializable=yes
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - --target=2.1
  # The verifier tests sign envelopes in the script with the alpha secp256k1
  # builtins; verification itself is the Data Standard's.
  - -Wno-crypto-text-is-alpha
